<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Path Simulator Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="sidebar">
        <div class="header-group">
            <h2>✈️ FlightSim Pro</h2>
            <button id="adminToggle" class="toggle-btn" onclick="toggleAdminMode()">
                Admin Mode: OFF
            </button>
        </div>
        
        <div id="userControls">
            <div class="control-group">
                <label>From (Source)</label>
                <select id="sourceSelect"></select>
            </div>
            
            <div class="control-group">
                <label>To (Destination)</label>
                <select id="destSelect"></select>
            </div>

            <div class="action-buttons">
                <button class="primary" onclick="runAlgorithm('cost')">Cheapest ($)</button>
                <button class="primary" onclick="runAlgorithm('time')">Fastest (Time)</button>
                <button class="primary" onclick="runAlgorithm('stops')">Min Stops</button>
            </div>

            <div class="results" id="resultsPanel">
                <h3>Trip Details</h3>
                <div class="stat-row"><span>Status:</span> <span id="resStatus">Ready</span></div>
                <div class="stat-row"><span>Cost:</span> <span id="resCost">-</span></div>
                <div class="stat-row"><span>Time:</span> <span id="resTime">-</span></div>
                <div class="stat-row"><span>Stops:</span> <span id="resStops">-</span></div>
                <div class="path-display" id="resPath">Select route...</div>
            </div>
        </div>

        <div id="adminControls" class="hidden">
            <div class="admin-panel">
                <h3>🛠️ Admin Tools</h3>
                <p class="hint">Click anywhere on the map to place a new Airport.</p>
                
                <hr>
                
                <h4>Add Flight Route</h4>
                <select id="adminSource"></select>
                <div class="arrow">⬇️</div>
                <select id="adminDest"></select>
                
                <div class="input-row">
                    <input type="number" id="newCost" placeholder="Cost ($)">
                    <input type="number" id="newTime" placeholder="Time (h)">
                </div>
                <button class="success" onclick="addCustomEdge()">+ Add Flight</button>
            </div>
        </div>
    </div>

    <div class="canvas-container" id="canvas">
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background:var(--node-bg)"></div> Airport</div>
            <div class="legend-item"><div class="dot" style="background:var(--highlight-check)"></div> Scanning</div>
            <div class="legend-item"><div class="dot" style="background:var(--highlight-path)"></div> Best Route</div>
        </div>
    </div>

    <div id="nodeModal" class="modal hidden">
        <div class="modal-content">
            <h3>New Airport</h3>
            <input type="text" id="newCode" placeholder="Code (e.g. LAX)" maxlength="3" style="text-transform:uppercase">
            <input type="text" id="newName" placeholder="City Name">
            <div class="modal-actions">
                <button onclick="cancelNodeAdd()">Cancel</button>
                <button class="success" onclick="confirmNodeAdd()">Create</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
